############### 센터 소개 ##############
center:
  enable: true
  image: 'images/center_intro_3.jpeg'
  title: "심리상담소 봄나눔"
  content: "먼저 저를 찾아주시고 이 공간에 방문 해주셔서 감사드립니다. 상담실 안팎에서의 목격했던 순간들을 통해 심리상담소의 이름을 “봄나눔” 으로 지었습니다. 아주 긴 겨울을 견뎌내고 결국 연둣빛 새싹을 틔워내고야 마는 봄처럼, 지난 몇 년간 내담자 분들과 함께 하는 여정에서 “봄”을 찾아내고  경험할 수 있어서 참 뜻깊은 시간이였습니다. <br><br> 심리상담은 내담자와 상담사 양쪽의 신뢰를 바탕으로 함께 호흡을 맞춰 나가는 작업이며, 저희가 함께 하는 시간을 통해서 “봄”을 찾고 경험 할 수 있길 소망합니다. 저를 믿고 기꺼이 이 과정에 참여해주시는 마음과 걸음에 미리 감사드립니다. <br><br> 웹사이트에서 “[예약하기](/booking)” 페이지를 통해 저와 상담을 신청하시게 되면, 첫 상담 전에 내담자와 상담사가 모두 더 준비된 마음으로 상담을 시작할 수 있도록 안내 이메일을 받으실 수 있습니다. 기대하는 마음으로 인사드리는 날을 기다리고 있겠습니다."

############### FAQ ##############
faq:
  enable: true
  title: "FAQ"
  faq_list:
    - name: 예약 과정이 어떻게 되나요?
      answer: A. 첫 예약이라면,  “[예약하기](/booking)” 페이지에서 “This is my first visit” 을 클릭해주세요. 선호하시는 언어 (영어 또는 한국어) 로 진행되는 상담 서비스를 선택하시면 예약 가능한 날짜와 시간을 고르실 수 있습니다. 이름과 연락처와 예약 사유를 남겨주시면 첫 상담에 앞서 초기 서류 및 안내 자료를 선호하시는 언어로 미리 이메일로 받으실 수 있습니다. 
      
    - name: 대면 상담도 예약할 수 있나요?
      answer: A. 현재는 모든 상담 서비스를 온라인으로 제공하고 있습니다. 다만, 임상적으로 필요하다고 판단되는 경우에는 상황에 따라 대면 상담 가능 여부를 검토하고 적절한 방안을 모색하기 위해 노력하겠습니다.
 
    - name: 청소년 상담도 가능한가요?
      answer: A. 네, 고등학생 이상부터 상담을 받고 있습니다. 
 
    - name: 예약 없이 방문 상담이 가능한가요?
      answer: A. 죄송합니다. 모든 상담은 현재 사전 예약제, 온라인으로 운영되고 있으며, 최소 48시간 전에 예약해 주셔야 합니다.

    - name: 한국이 아닌 해외에 거주하고 있어도  온라인 상담을 예약할 수 있나요?
      answer: A. 심리상담에 대한 면허 및 법적 규정은 국가와 지역에 따라 다를 수 있습니다. 이에 따라 저는 대한민국 내에서 전문 자격을 보유하고 있으며, 상담 시점에 대한민국에 실제로 체류하고 계신 분들을 대상으로만 온라인 상담 서비스를 제공하고 있습니다.

    - name: 미국 보험사에 직접 청구(direct billing)가 가능한가요?
      answer: A. 아니요. 다만, 필요하신 경우 미국 보험사에 본인이 직접 환급(reimbursement)을 신청하실 수 있도록 invoice 및 superbill을 제공해 드릴 수 있습니다. 보험 적용 여부 및 환급 가능 금액은 가입하신 보험사의 정책과 보장 내용에 따라 달라질 수 있습니다.

    - name: 결제는 어떻게 할 수 있나요?
      answer: |
        A. 비대면 온라인 상담의 결제 옵션은 아래와 같습니다.
        * **계좌이체**: 박우아,  하나은행 336-910487-67107
        * **신용카드**(BC, 농협, 국민, 신한, 하나, 삼성, 현대, 롯데, 우리): “결제선생” 으로 받은 알림을 통해
        * **간편결제**(네이버페이,  엘.페이, 카카오페이 ): “결제선생”으로 받은 알림을 통해

    - name: “결제선생” 은 어떤 서비스인가요?
      answer: A. 결제선생은 국내 여러 사업장에서 사용하는 안전한 온라인 결제 서비스입니다. 카카오톡 알림톡 또는 문자메시지를 통해 결제 요청을 편리하게 전송할 수 있으며, 고객은 별도로 방문하지 않고도 온라인으로 신용카드 결제를  편리하게 진행할 수 있습니다.

    - name: 해외 발행 카드로도 결제가 가능한가요? 그 외에는 또 어떤 결제 수단을 이용할 수 있나요?
      answer: "A. 네, 비자, 마스터, JCB, 아메리칸 익스프레스, 다이너스 클럽, 디스커버리, 삼성페이, 그리고 애플페이로도 단말기를 통한 대면 결제 가능합니다."

    - name: 상담 예약 신청이 정상적으로 접수되었는지 어떻게 확인할 수 있나요?
      answer: A. 본 웹사이트의 예약 페이지를 통해 상담 예약을 신청하시면, 첫 상담 전에 귀하가 선택하신 언어(한국어 또는 영어)로 된 초기 접수 서류를 보내드립니다. 또한 예약 시간 확보를 위해 온라인 결제를 진행하실 수 있도록 결제선생에서 카카오톡 알림톡 혹은 문자 메세지를 통해 결제 안내를 보내드립니다. 결제가 확인되면 예약이 최종 확정됩니다. 결제 절차, 취소 및 환불 규정에 관한 자세한 내용은 초기 접수 서류에 포함된 결제 방침 동의서를 참고해 주시기 바랍니다.

    - name: <심리상담소 봄나눔> 의 연락처는 어떻게 돼나요?
      answer: |
        * 이메일: sharingspring2026@gmail.com
        * 전화: 010-7917-2273

