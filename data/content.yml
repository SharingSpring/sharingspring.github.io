########################### About ##################################
about:
  enable: true
  image: 'images/mpark_r.jpeg'
  title: '박우아, M.A., M.S.Ed.'
  # degree: 'M.A., M.S.Ed.'
  content: 저는 서울에서 한국과 영어로 개인 심리상담을 제공하는 임상심리사로서, 두 언어를 모두 편안하게 구사할 수 있습니다. 인종적·문화적·사회적·종교적 배경이 다양한 25개국 이상의 국적을 갖고 계신 내담자 분들을 상담해 온 경험을 바탕으로 제가 상담실에서 만나 뵈었던 대상은 다음과 같습니다 - 이중문화 및 다문화 배경의 개인, 다문화 가정, 제3문화 아이들 (TCK), 한국계 미국인 주한미군, 국외 거주자, 교환학생, 한국계 입양인, 한국 귀국자, 국내 거주 한국인, 그리고 한국에서 근무하는 외국인 종사자. 또한 국내 여러 국제학교를 비롯한 교육기관, 한국 내 외국계열사 기업, 교회와 협력했습니다. <br><br> <심리상담소 봄나눔> 에서는 불안, 우울, ADHD, 트라우마, 관계적 어려움, 정체성, 정서적 소속감, 문화 적응, 직장 스트레스, 애도 및 상실 등 다양한 어려움에 대한 개인 심리상담을 제공합니다. 삶의 전환 과정과 적응 스트레스, 정체성 발달, 자존감, 진로 및 커리어 관련 고민을 경험하는 내담자 분들과도 상담을 진행했습니다. 이와 더불어 부모 역할과 양육 스트레스와 관련된 부모 교육 및 상담도 제공하고 있습니다. <br><br> 저는 다문화 상담에 기반을 둔 통합적 심리상담을 제공하며, 인지행동적 접근과 정신역동적 접근에 기반한 치료적 관점을 함께 통합하여 작업합니다. 많은 내담자 분들께서 마음이 지치고 어려운 시기에 상담을 찾는다는 점을 특히 중요시 여기며, 각 개인의 삶의 경험과 맥락을 존중하는 협력적이고 문화적으로 민감한 상담적 관계를 형성하고 실천하고자 노력합니다. 상담을 통해 내담자 분들께서 더 깊은 자기이해와 정서적 회복탄력성을 기르고, 의미 있고 지속적인 변화를 경험할 수 있도록 돕는 것을 목표로 하고 있습니다. 
  button:
    enable: false
    label: 'DOWNLOAD MY RESUME'
    link: #
    icon: 'fa-download'

