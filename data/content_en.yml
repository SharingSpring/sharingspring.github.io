############### 센터 소개 ##############
center:
  enable: true
  image: 'images/center_intro_3.jpeg'
  title: "About SharingSpring"
  content: "You have found me, and I am truly grateful that our paths have crossed — or crossed again. I named this private practice “SharingSpring” based on my experiences both within and beyond the therapy room. Just as spring quietly emerges after a long winter with the first hint of a green sprout, I have had the privilege of witnessing growth, healing, and resilience alongside my clients over the years. Walking with clients through their journeys has often felt like discovering and experiencing “spring” together. <br><br> At Sharing Spring, you can connect with a bilingual English- and Korean-speaking therapist based in Seoul, offering online therapy throughout South Korea. Therapy is available for anxiety, depression, ADHD, trauma, relationship challenges, cross-cultural adjustment, and life transitions, providing compassionate, culturally responsive care for both local and international clients. <br><br> In addition to serving local Korean clients, Sharing Spring provides English- and Korean-speaking therapy for expats in South Korea, international students, professionals, and families in Seoul and throughout South Korea. Therapy is available online across South Korea, with in-person sessions in Seoul coming soon. <br><br> Once you request a session through the “[Book Now](/en/booking)” tab on this website, you will receive a guideline email that walks you through the next steps so that we can both feel prepared for our first session together. I look forward to meeting and working with you!"

############## FAQ. ##################
faq:
  enable: true
  title: "FAQ"
  faq_list:
    - name: How do I schedule an appointment?
      answer: A. If you are scheduling your first appointment, please click "This is my first visit" on the “[Book Now](/en/booking)” page. From there, you can select a service offered in your preferred language (English or Korean) and choose an available date and time that works for you. <br><br> After submitting your name, contact information, and a brief reason for your visit, you will receive intake paperwork and additional information by email in your preferred language before your first session.

    - name: "Can I schedule an in-person session?"
      answer: "A. At this time, I offer therapy services exclusively through online sessions. However, if in-person meetings are determined to be clinically appropriate and necessary, I will make reasonable efforts to explore available options on a case-by-case basis."

    - name: Do you work with minor clients as well?
      answer: A. Yes, I also provide therapy services for adolescents aged 14 and older.
    
    - name: Do you accept walk-ins?
      answer: A. Unfortunately, no. At this time, I do not offer walk-in appointments or in-person sessions. All services are currently provided online, and appointments must be scheduled at least 48 hours in advance.

    - name: "I am located outside of South Korea. Can I schedule an online therapy session?"
      answer: "A. Because professional licensure requirements and regulations vary across jurisdictions, I am only able to provide online therapy services to clients who are physically located in South Korea at the time of their sessions. This is in accordance with my professional licensure and applicable regulations."

    - name: "Do you provide direct billing to U.S. insurance companies?"
      answer: "A. No. However, upon request, I can provide invoices and superbills that clients may submit directly to their U.S. insurance providers for possible out-of-network reimbursement. Please note that reimbursement eligibility and coverage are determined solely by your insurance plan."

    - name: "What forms of payments do you accept?" 
      answer: |
        A. Currently, you can submit payments through:
        * **Korean bank transfers** to 박우아 at Hana Bank 336-910487-67107
        * **Korean credit cards** (BC, 농협, 국민, 신한, 하나, 삼성, 현대, 롯데, 우리) via electronic payment called “결제선생” (“Payment Teacher”)
        * **간편결제** (Naver Pay, L.Pay, Kakao Pay) via “결제선생” (“Payment Teacher”)
      
    - name: "What is “결제선생”?"
      answer: "A. 결제선생 (“Payment Teacher”) is a secure payment processing service used by many businesses in South Korea. It allows payment requests to be sent conveniently via KakaoTalk notification messages or text messages, enabling clients to complete credit card payments online without needing to visit the office in person."

    - name: Do you take international cards and any other forms of payments?
      answer: "A. Yes, following forms of payments are accepted in-person through a registered credit card terminal service: <br> Visa, Master, JCB, American Express, Diners Club, and Discovery, Samsung Pay, and Apple Pay."

    - name: "How will I know if my appointment request has been confirmed?"
      answer: "A. Once you submit an appointment request through the “Book Now” page, you will receive intake forms in your preferred language (Korean or English) to complete before your first session. You will also receive a payment request via a KakaoTalk notification message or text message from 결제선생, allowing you to conveniently and securely reserve your appointment time. A confirmation of your appointment will be sent after the payment has been received. For more information regarding payment procedures, cancellations, and refunds, please refer to the Payment Policy Agreement included with the intake forms."

    - name: "How can I contact the provider?"
      answer: | 
           * Email: sharingspring2026@gmail.com 
           * Phone: 010-7917-2273

##### Updates
updates:
  enable: true
  # title: "Announcement"
  items:
    - date: "2026-06-30"
      title: "Practice Update: Individual Therapy Fee & In-Person Sessions"
      body: |
        At SharingSpring, I am committed to providing therapy that is compassionate, culturally responsive, and accessible to both Korean- and English-speaking clients. As the practice continues to grow, I am pleased to share two updates that reflect my commitment to providing equitable, consistent, and responsive care.

        Beginning July 12, 2026:
          * Individual therapy (50 minutes) will be offered at a standard fee of 120,000 KRW per session, regardless of whether therapy is conducted in Korean or English.
          * Both online and in-person individual therapy will be available at the same standard fee of 120,000 KRW per session, allowing clients to choose the format that best supports their needs and circumstances.

        As a bilingual therapist, I believe that the value of therapy lies in the quality of care—not in the language in which it is provided or the format in which sessions take place. These updates reflect my commitment to providing equitable, consistent, and client-centered care. In response to the growing interest in in-person sessions, I am also pleased to expand my practice by offering in-person sessions, while continuing to provide secure online therapy for clients throughout South Korea. As the current office is less suitable to accomodate in-person sessions, an alternative space that is more convenient will be provided upon request of in-person sessions. Precise address of its location will be shared upon request for in-person sessions. 

        To ensure a smooth transition, previously communicated fees and promotions will continue to be honored.

          * Current clients who began therapy before this change will continue to pay the fee established at the start of therapy.
          * New clients who make an appointment by July 11, 2026, will remain eligible for the previously announced 50% discount on their first therapy session, even if their first appointment takes place after July 11, 2026.

        The standard fee of 120,000 KRW per session will apply to all new clients who make an appointment after July 11, 2026. A limited number of reduced-fee appointments may also be available for individuals experiencing financial hardship. If cost is a significant barrier to accessing therapy, please feel free to inquire about current availability.

        Thank you for your continued trust and support. I look forward to continuing to provide a warm, respectful, and collaborative space where clients from diverse backgrounds can feel supported as they navigate life's challenges.

        Warmly,

        Michelle Park, M.A., M.S.Ed.<br>
        Licensed Clinical Therapist<br>
        Founder, Sharing Spring

        Practice Update: Individual Therapy Fees & In-Person Sessions

          - Published June 30, 2026
          - Effective July 12, 2026








