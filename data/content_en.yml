########################### About ##################################
about:
  enable: true
  image: 'images/mpark_r.jpeg'
  title: 'Michelle Park, M.A., M.S.Ed.'
  # degree: 'M.A., M.S.Ed.'
  content: I am a licensed clinical therapist based in Seoul, South Korea, and I provide individual therapy in both Korean and English. Having worked with clients from over 25 countries and across a wide range of ethnic, cultural, social, and religious backgrounds, I bring experience supporting diverse populations, including bi- and multicultural individuals, multicultural families, third culture individuals, Korean-American veterans, expatriate families, exchange students, Korean adoptees, Korean returnees, local Korean nationals, and foreign professionals working in Korea. I have also collaborated with churches, international companies, and educational institutions, including international schools throughout South Korea.<br><br> At SharingSpring, individual therapy is available for a range of concerns, including but not limited to anxiety, depression, trauma, panic disorder, ADHD, interpersonal difficulties, identity, sense of belonging, cultural adjustment, workplace stress, and grief/loss. I also work with clients navigating life transitions and adjustment-related stress, identity development, intercultural challenges, self-esteem, and career concerns. In addition, I offer parent education and support for parenting-related stress. <br><br> I provide integrative psychotherapy grounded in multicultural counseling, informed by cognitive-behavioral and psychodynamic approaches. Recognizing that many clients seek therapy during times of vulnerability, I strive to build and practice a collaborative, culturally responsive therapeutic relationship that honors each individual’s lived experience. Through therapy, I aim to support clients in developing greater self-understanding, emotional resilience, and meaningful, lasting change.<br><br> Therapy is a collaborative process built on trust, openness, and mutual commitment, and it is my hope that through our work together, we may discover and experience moments of “spring.” Thank you in advance for placing your trust in this therapeutic relationship and for being willing to take this step with me.
