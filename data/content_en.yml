############### 센터 소개 ##############
center:
  enable: true
  image: 'images/center_intro_3.jpeg'
  title: "About SharingSpring"
  content: "You have found me, and I am truly grateful that our paths have crossed — or crossed again. I named this private practice “SharingSpring” based on my experiences both within and beyond the therapy room. Just as spring quietly emerges after a long winter with the first hint of a green sprout, I have had the privilege of witnessing growth, healing, and resilience alongside my clients over the years. Walking with clients through their journeys has often felt like discovering and experiencing “spring” together. <br><br> Therapy is a collaborative process built on trust, openness, and mutual commitment, and it is my hope that through our work together, we may discover and experience moments of “spring.” Thank you in advance for placing your trust in this therapeutic relationship and for being willing to take this step with me. <br><br> Once you request a session through the “[Book Now](/en/booking)” tab on this website, you will receive a guideline email that walks you through the next steps so that we can both feel prepared for our first session together. I look forward to meeting and working with you!"

############## FAQ. ##################
faq:
  enable: true
  title: "FAQ"
  faq_list:
    - name: How do I schedule an appointment?
      answer: A. If you are scheduling your first appointment, please click "This is my first visit" on the “[Book Now](/en/booking)” page. From there, you can select a service offered in your preferred language (English or Korean) and choose an available date and time that works for you. <br><br> After submitting your name, contact information, and a brief reason for your visit, you will receive intake paperwork and additional information by email in your preferred language before your first session.

    - name: "Can I schedule an in-person session?"
      answer: "A. At this time, I offer therapy services exclusively through online sessions. However, if in-person meetings are determined to be clinically appropriate and necessary, I will make reasonable efforts to explore available options on a case-by-case basis."

    - name: Do you work with minor clients as well?
      answer: A. Yes, I also provide therapy services for adolescents aged 14 and older.
      
    - name: "I am located outside of South Korea. Can I schedule an online therapy session?"
      answer: "A. Because professional licensure requirements and regulations vary across jurisdictions, I am only able to provide online therapy services to clients who are physically located in South Korea at the time of their sessions. This is in accordance with my professional licensure and applicable regulations."

    - name: "Do you provide direct billing to U.S. insurance companies?"
      answer: "A. No. However, upon request, I can provide invoices and superbills that clients may submit directly to their U.S. insurance providers for possible out-of-network reimbursement. Please note that reimbursement eligibility and coverage are determined solely by your insurance plan."

    - name: "What forms of payments do you accept?" 
      answer: |
        A. Currently, you can submit payments through:
        * **Korean bank transfers** to 박우아 at Hana Bank 336-910487-67107
        * **Korean credit cards** (BC, 농협, 국민, 신한, 하나, 삼성, 현대, 롯데, 우리) via electronic payment called “결제선생” (“Payment Teacher”)
        * **간편결제** (Naver Pay, L.Pay, Kakao Pay) via “결제선생” (“Payment Teacher”)
      
    - name: "What is “결제선생”?"
      answer: "A. 결제선생 (“Payment Teacher”) is a secure payment processing service used by many businesses in South Korea. It allows payment requests to be sent conveniently via KakaoTalk notification messages or text messages, enabling clients to complete credit card payments online without needing to visit the office in person."

    - name: "How will I know if my appointment request has been confirmed?"
      answer: "A. Once you submit an appointment request through the “Book Now” page, you will receive intake forms in your preferred language (Korean or English) to complete before your first session. You will also receive a payment request via a KakaoTalk notification message from 결제선생, allowing you to conveniently and securely reserve your appointment time. A confirmation of your appointment will be sent after the payment has been received. For more information regarding payment procedures, cancellations, and refunds, please refer to the Payment Policy Agreement included with the intake forms."

