######################## default configuration ####################
baseURL = "https://sharingspring.github.io/"
title = "SharingSpring"
theme = "port-hugo"
publishDir = "docs"

############################# Plugins ##############################

# CSS Plugins
[[params.plugins.css]]
link = "https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
[[params.plugins.css]]
link = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
[[params.plugins.css]]
link = "https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.1.0/css/hover-min.css"
[[params.plugins.css]]
link = "https://fonts.googleapis.com/css?family=Rubik:300,400,500,700,900&display=swap"
[[params.plugins.css]]
link = "plugins/text-animation/text-animation.css"
[[params.plugins.css]]
link = "plugins/hugrid/hugrid.css"

# JS Plugins
[[params.plugins.js]]
link = "https://code.jquery.com/jquery-3.5.1.min.js"
[[params.plugins.js]]
link = "https://cdnjs.cloudflare.com/ajax/libs/waypoints/4.0.1/jquery.waypoints.js"
[[params.plugins.js]]
link = "plugins/text-animation/text-animation.js"
[[params.plugins.js]]
link = "plugins/hugrid/hugrid.min.js"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

############################## language ###############################

defaultContentLanguage = 'ko'   # 기본 언어 설정
hasCJKLanguage = true           # 한국어/중국어/일본어 줄바꿈/단어 계산 최적화

[languages]
  [languages.ko]
    languageName = '한국어'
    contentDir = 'content/ko'    # (선택사항) 한국어 콘텐츠 폴더 분리 시
    weight = 1                  # 언어 선택기에서 순서

  [languages.en]
    languageName = 'English'
    contentDir = 'content/en'
    weight = 2


############################## navigation ###############################

# main menu
[[menu.main]]
name = "Home"
URL = "#"
weight = 1

[[menu.main]]
name = "About me"
URL = "#about"
weight = 2

[[menu.main]]
name = "Book Appointment"
URL = "#"
weight = 4

[[menu.main]]
name = "FAQ"
URL = "#"
weight = 3


#################### default parameters ################################
[params]
copyright = "All Rights Reserved &copy;"
# Meta data
description = "Personal Portfolio"
author = "Michelle Park"
favicon = "images/ssssharingspring.png"
google_analytics = "G-ABCDEFG123"
logo_light = "images/sharingspring.png"
logo_dark = "images/sharingspring.png"

# Preloader
[params.preloader]
enable = false
preloader = "images/preloader.gif" # use jpg, png, svg or gif format.

############################# social site ########################

[[params.social]]
icon = "fab fa-instagram"
link = "https://www.instagram.com/sharingspring"

[[params.social]]
icon = "fab fa-linkedin"
link = "https://kr.linkedin.com/in/michellepark-sharingspring"

[[params.social]]
icon = "fab fa-threads"
link = "https://www.threads.com/@sharingspring"



